paths:
  /health:
    get:
      summary: Service health check
      description: Returns overall service and dependency health
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is healthy or degraded
          content:
            application/json:
              schema:
                type: object
              examples:
                sample:
                  summary: Example health
                  value:
                    status: healthy
                    timestamp: '2025-01-01T00:00:00.000Z'
                    version: '1.0.0'
                    uptime: 12345
                    services:
                      redis: { status: healthy, responseTime: 5 }
                      chains: { status: healthy, healthyProviders: 6, totalProviders: 6 }
        '503':
          description: Service is unhealthy
  /health/liveness:
    get:
      summary: Kubernetes liveness probe
      description: Lightweight endpoint to confirm the process is alive
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
              examples:
                sample:
                  value:
                    status: alive
                    timestamp: '2025-01-01T00:00:00.000Z'
                    uptime: 100
  /health/readiness:
    get:
      summary: Kubernetes readiness probe
      description: Checks if critical dependencies are ready to accept traffic
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              examples:
                ready:
                  value: { status: ready, services: { redis: ready, blockchain: ready } }
        '503':
          description: Service is not ready
          content:
            application/json:
              examples:
                notReady:
                  value:
                    { status: not_ready, services: { redis: not_ready, blockchain: not_ready } }
  /health/metrics:
    get:
      summary: Prometheus metrics
      description: Returns Prometheus-formatted metrics for scraping
      tags: [Health]
      security: []
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
  /health/enhanced:
    get:
      summary: Enhanced health
      description: Returns detailed monitoring information
      tags: [Health]
      security: []
      responses:
        '200':
          description: Enhanced health detail
  /health/dashboard:
    get:
      summary: Performance dashboard data
      description: Returns performance dashboard metrics
      tags: [Health]
      security: []
      parameters:
        - in: query
          name: timeRange
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d, 30d]
            default: 1h
        - in: query
          name: detailed
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Dashboard metrics
  /health/cost:
    get:
      summary: Cost metrics
      description: Returns cost monitoring and optimization metrics
      tags: [Health]
      security: []
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [1h, 24h, 7d, 30d]
            default: 24h
        - in: query
          name: detailed
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Cost metrics
  /health/events:
    get:
      summary: Event system metrics
      description: Returns event bus and processing metrics
      tags: [Health]
      security: []
      responses:
        '200':
          description: Event metrics
  /health/cache-warming:
    get:
      summary: Cache warming performance
      description: Returns cache warming performance and strategy metrics
      tags: [Health]
      security: []
      responses:
        '200':
          description: Cache warming metrics
  /health/alerts:
    get:
      summary: System alerts
      description: Returns active system alerts and notifications
      tags: [Health]
      security: []
      parameters:
        - in: query
          name: severity
          schema:
            type: string
            enum: [info, warning, critical, emergency]
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Alerts list
  /health/force-update:
    post:
      summary: Force metrics update
      description: Forces immediate refresh of monitoring metrics
      tags: [Health]
      security: []
      responses:
        '200':
          description: Update triggered
        '401':
          description: Unauthorized
