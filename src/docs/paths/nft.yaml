paths:
  /api/nft/{address}:
    get:
      tags: [NFT]
      summary: Get NFT portfolio
      parameters:
        - in: path
          name: address
          required: true
          schema:
            type: string
        - in: query
          name: chains
          schema:
            type: string
        - in: query
          name: categories
          schema:
            type: string
        - in: query
          name: standards
          schema:
            type: string
        - in: query
          name: includeMetadata
          schema:
            type: boolean
        - in: query
          name: includeListings
          schema:
            type: boolean
        - in: query
          name: includeAnalytics
          schema:
            type: boolean
        - in: query
          name: forceRefresh
          schema:
            type: boolean
        - in: query
          name: minValue
          schema:
            type: number
      responses:
        '200':
          description: NFT portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFTPortfolioResponse'
              examples:
                sample:
                  summary: Example NFT portfolio
                  value:
                    success: true
                    data:
                      totalValueUSD: 25000
                      totalCollections: 2
                      totalNFTs: 5
                      collections:
                        - id: 'ethereum:0xcollection'
                          contractAddress: '0xcollection'
                          chainId: ethereum
                          standard: erc-721
                          name: 'Cool Collection'
                          symbol: 'COOL'
                          tokens:
                            - id: 'ethereum:0xcollection:1'
                              contractAddress: '0xcollection'
                              tokenId: '1'
                              chainId: ethereum
                              standard: erc-721
                              owner: '0xuser'
                              name: 'Cool #1'
                              image: 'https://.../1.png'
                              attributes: [{ trait_type: 'Background', value: 'Blue' }]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/nft/{address}/collection/{contractAddress}:
    get:
      tags: [NFT]
      summary: Get NFT collection info
      parameters:
        - in: path
          name: address
          required: true
          schema: { type: string }
        - in: path
          name: contractAddress
          required: true
          schema: { type: string }
        - in: query
          name: chainId
          required: true
          schema: { type: string }
        - in: query
          name: includeAnalytics
          schema: { type: boolean }
      responses:
        '200':
          description: Collection info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFTPortfolioResponse'
              examples:
                sample:
                  summary: Example NFT portfolio
                  value:
                    success: true
                    data:
                      totalValueUSD: 25000
                      totalCollections: 2
                      totalNFTs: 5
                      collections:
                        - id: 'ethereum:0xcollection'
                          contractAddress: '0xcollection'
                          chainId: ethereum
                          standard: erc-721
                          name: 'Cool Collection'
                          symbol: 'COOL'
                          tokens:
                            - id: 'ethereum:0xcollection:1'
                              contractAddress: '0xcollection'
                              tokenId: '1'
                              chainId: ethereum
                              standard: erc-721
                              owner: '0xuser'
                              name: 'Cool #1'
                              image: 'https://.../1.png'
                              attributes: [{ trait_type: 'Background', value: 'Blue' }]
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/nft/{contractAddress}/{tokenId}:
    get:
      tags: [NFT]
      summary: Get NFT metadata by contract and tokenId
      parameters:
        - in: path
          name: contractAddress
          required: true
          schema: { type: string }
        - in: path
          name: tokenId
          required: true
          schema: { type: string }
        - in: query
          name: chainId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Token metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFTMetadataResponse'
              examples:
                sample:
                  summary: Example NFT metadata
                  value:
                    success: true
                    data:
                      id: 'ethereum:0xcollection:1'
                      contractAddress: '0xcollection'
                      tokenId: '1'
                      chainId: ethereum
                      standard: erc-721
                      owner: '0xuser'
                      name: 'Cool #1'
                      image: 'https://.../1.png'
                      attributes:
                        - trait_type: 'Background'
                          value: 'Blue'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: NFT not found }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/nft/detectors:
    get:
      tags: [NFT]
      summary: List registered NFT detectors
      responses:
        '200': { description: Detector list }
