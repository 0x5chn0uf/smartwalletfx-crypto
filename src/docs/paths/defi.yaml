paths:
  /api/defi/{address}:
    get:
      tags: [DeFi]
      summary: Get DeFi portfolio
      parameters:
        - in: path
          name: address
          required: true
          schema:
            type: string
        - in: query
          name: chains
          schema:
            type: string
          description: Comma-separated chain slugs
        - in: query
          name: protocols
          schema:
            type: string
          description: Comma-separated protocol slugs
        - in: query
          name: includeInactive
          schema:
            type: boolean
        - in: query
          name: includeYield
          schema:
            type: boolean
        - in: query
          name: includeRisk
          schema:
            type: boolean
        - in: query
          name: minValue
          schema:
            type: number
        - in: query
          name: forceRefresh
          schema:
            type: boolean
      responses:
        '200':
          description: DeFi portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeFiPositionsResponse'
              examples:
                sample:
                  summary: Example DeFi positions
                  value:
                    success: true
                    data:
                      positions:
                        - id: 'eth:aave-v3:0xpool:0xuser'
                          protocol: aave-v3
                          chainId: ethereum
                          type: lending
                          status: active
                          name: 'Aave V3 Lending'
                          totalValueUSD: 12345.67
                          suppliedTokens:
                            - token: { symbol: USDC, address: 0x..., decimals: 6 }
                              amount: '10000'
                              amountFormatted: '10,000.00'
                              valueUSD: 10000
                          borrowedTokens:
                            - token: { symbol: ETH, address: 0x..., decimals: 18 }
                              amount: '1.0'
                              amountFormatted: '1.0'
                              valueUSD: 2345.67
                          rewards: []
                          apy: 0.03
                          healthFactor: 1.8
                          risk: low
                          metadata: {}
                      portfolioSummary:
                        totalValueUSD: 12345.67
                        positionCount: 1
                        protocols: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/defi/{address}/protocols/{protocol}:
    get:
      tags: [DeFi]
      summary: Get positions for a protocol
      parameters:
        - in: path
          name: address
          required: true
          schema:
            type: string
        - in: path
          name: protocol
          required: true
          schema:
            type: string
        - in: query
          name: chains
          schema:
            type: string
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeFiPositionsResponse'
              examples:
                sample:
                  summary: Uniswap V3 positions
                  value:
                    success: true
                    data:
                      positions:
                        - id: 'eth:uniswap-v3:0xpool:0xuser'
                          protocol: uniswap-v3
                          chainId: ethereum
                          type: liquidity_pool
                          status: active
                          name: 'UNI V3 LP'
                          totalValueUSD: 5000
                          suppliedTokens: []
                          rewards: []
                          metadata: { feeTier: 3000 }
                      portfolioSummary:
                        totalValueUSD: 5000
                        positionCount: 1
                        protocols: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No positions for protocol
        '500':
          $ref: '#/components/responses/InternalError'
